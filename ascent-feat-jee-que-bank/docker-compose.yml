services:
  postgres:
    image: postgres:16
    container_name: que-bank
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: que_bank
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ascent-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://postgres:admin123@postgres:5432/que_bank"
      PORT: 5001
      NODE_ENV: production
      FRONTEND_URL: "http://localhost:5173"
    ports:
      - "5001:5001"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ascent-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:

